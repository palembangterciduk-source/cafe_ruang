<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kopi & Ruang Senja | Self-Order & klikQRIS</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #261D17;
    }
    iframe {
      border: none;
      width: 100vw;
      height: 100vh;
      display: block;
    }
  </style>
</head>
<body>

  <iframe id="cafeFrame" allow="clipboard-read; clipboard-write; payment;"></iframe>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbx8VfPdT_GVsR-jMBmW_Bsj1SlXT115q5643S4V8WsAeboeJMxqNc0JffT8XpfIpfQ_/exec";
    const frame = document.getElementById("cafeFrame");

    // 1. Teruskan parameter URL (contoh: ?meja=05 atau ?role=kds) langsung ke src iframe
    frame.src = GAS_URL + window.location.search;

    // 2. Teruskan juga via postMessage saat frame selesai loading (Dual Insurance)
    const urlParams = new URLSearchParams(window.location.search);
    const meja = urlParams.get("meja");
    const role = urlParams.get("role");

    frame.onload = function() {
      try {
        frame.contentWindow.postMessage({
          type: "CAFE_PARAMS",
          meja: meja,
          role: role
        }, "*");
      } catch (e) { }
    };
  </script>

</body>
</html>
